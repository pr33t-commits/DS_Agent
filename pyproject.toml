[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ds-understanding-agent"
version = "0.1.0"
description = "Local ReAct agent for understanding a dataset and its column dictionary"
requires-python = ">=3.11"
dependencies = ["langchain>=1.0,<2", "langgraph>=1.0,<2", "langchain-ollama>=1.0,<2", "langchain-openai>=1.0,<2", "pydantic>=2.0,<3", "pandas>=2.2,<3", "numpy>=2,<3", "scipy>=1.15,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
transformer = ["torch>=2.2", "transformers>=4.51,<6"]

[project.scripts]
understand = "understanding_agent.cli:main"

[tool.setuptools.packages.find]
include = ["understanding_agent*", "inference*", "evaluation*", "training*", "data"]
exclude = ["understanding_agent.runs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
